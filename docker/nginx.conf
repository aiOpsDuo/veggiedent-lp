# Mapa de caminhos do domínio único (SDD § "Visão de tiers" e § D-04):
#
#   /        -> LP estática
#   /admin   -> painel estático, construído com base /admin/
#   /api/*   -> API NestJS, no contêiner `api`
#
# É o mesmo mapa da entrada única de desenvolvimento (T20), agora servido por
# nginx em vez de pelo servidor do Vite. Ele existe para que o roteamento seja
# exercitado antes da publicação, e não desenhado nela.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A LP não pode deixar de ser servida por causa de um pedido grande ao CMS;
    # o limite é da API, não do proxy. 60 MB cobre o envio de mídia pelo painel
    # que ainda passa pela API (os bytes de arquivo grande vão direto ao
    # armazenamento — SDD § D-05).
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API -------------------------------------------------------------
    # `proxy_pass` sem caminho preserva o URI original, e a API espera o
    # prefixo `/api` (API_PREFIX em apps/api). `= /api` existe para o caso sem
    # barra: sem ele, o nginx devolveria 301 para /api/ em vez de encaminhar.
    location = /api {
        proxy_pass http://api:3000;
        include /etc/nginx/proxy_veggiedent.conf;
    }

    location /api/ {
        proxy_pass http://api:3000;
        include /etc/nginx/proxy_veggiedent.conf;
    }

    # --- Painel ----------------------------------------------------------
    # `/admin` sem barra final é o defeito que a T10 encontrou: depois do login
    # o roteador deixa o endereço sem barra, e recarregar ali precisa devolver
    # o painel. O redirecionamento permanente resolve, e é o mesmo
    # comportamento do servidor de desenvolvimento e do `preview`.
    location = /admin {
        return 301 /admin/;
    }

    # SPA: qualquer caminho abaixo de /admin/ que não seja arquivo cai no
    # index.html do painel, para que o roteador do React assuma.
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location /admin/assets/ {
        # Um cabeçalho só, não dois: `expires 1y` já emite um `Cache-Control:
        # max-age=...`, e um `add_header Cache-Control` ao lado faria o nginx
        # mandar duas linhas do mesmo campo. O valor combinado é válido por RFC,
        # mas há CDN que trata mal campo repetido — e este arquivo é exatamente
        # o que vai ficar atrás de uma CDN quando o produto for publicado.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- LP --------------------------------------------------------------
    location /assets/ {
        # Um cabeçalho só, não dois: `expires 1y` já emite um `Cache-Control:
        # max-age=...`, e um `add_header Cache-Control` ao lado faria o nginx
        # mandar duas linhas do mesmo campo. O valor combinado é válido por RFC,
        # mas há CDN que trata mal campo repetido — e este arquivo é exatamente
        # o que vai ficar atrás de uma CDN quando o produto for publicado.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
